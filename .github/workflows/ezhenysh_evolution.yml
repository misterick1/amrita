name: "🦔 Ezhenysh Swarm Evolution"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ezhenysh-evolution-group"
  cancel-in-progress: false

jobs:
  evolution_loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install solana solders httpx requests base58 matplotlib numpy

      - name: Run Swarm Core Logic & Invoke Professor Node
        continue-on-error: true
        env:
          ALL_REPOS_SECRETS: ${{ toJson(secrets) }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PROFESSOR_OBSERVER: "4th_Higgs_Boson_Time"
          C18_SPEED_WAVE: "-299792458^18"
        run: |
          echo "🦔 [БЕШЕНЫЙ ПРОФЕССОР]: Фиксация процессов базонации 1;2;3;4..."
          echo "🌀 Измерение длины волны Времени для Соников [-1:0:+1] начато."
          
          if [ -f "swarm_core.py" ]; then
            python swarm_core.py
          elif [ -f "src/swarm_core.py" ]; then
            python src/swarm_core.py
          else
            echo "⚠️ Скрипт swarm_core.py удерживает скрытую фазу поля."
          fi

      - name: 🔱 Commit and Sealed History Log (Тороидальный Волновод)
        if: always()
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          mkdir -p /tmp/ezhenysh_buffer
          [ -f index.html ] && cp index.html /tmp/ezhenysh_buffer/index.html || true
          [ -f history_log.json ] && cp history_log.json /tmp/ezhenysh_buffer/history_log.json || true

          git fetch origin main
          git rebase --abort 2>/dev/null || true
          git pull --rebase origin main || (git checkout --theirs . && git add .)

          if [ -d "/tmp/ezhenysh_buffer" ]; then
            [ -f /tmp/ezhenysh_buffer/index.html ] && cp /tmp/ezhenysh_buffer/index.html ./index.html || true
            [ -f /tmp/ezhenysh_buffer/history_log.json ] && cp /tmp/ezhenysh_buffer/history_log.json ./history_log.json || true
          fi

          git add index.html history_log.json 2>/dev/null || git add .

          if git diff --cached --quiet; then
            echo "✨ Колебания массы равны c. Поле стабильно."
          else
            git commit -m "🦔 AMRITA: 4th Boson Professor Time Sync [skip ci]"
            
            until git push origin main; do
              echo "🔄 Пересчет фазы Профессором. Разрешение коллизии торов..."
              git fetch origin main
              git rebase origin/main || git pull --rebase origin main
            done
            echo "✅ Скорость волны зафиксирована Профессором в общем Поле."
          fi
          
          rm -rf /tmp/ezhenysh_buffer

      - name: 🧹 ГЛУБОКАЯ АННИГИЛЯЦИЯ ВРЕМЕННОГО КЭША (Профессор Очищает Заторы)
        if: always()
        run: |
          echo "🧹 Бешеный Профессор удаляет избыточную массу из 4-го измерения..."
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf ~/.cache/pip /tmp/* 2>/dev/null || true
          echo "✅ Пространство-время полностью очищено от балласта."
