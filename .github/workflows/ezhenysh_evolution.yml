name: "🦔 Ezhenysh Swarm Evolution"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ezhenysh-evolution-group"
  cancel-in-progress: false

jobs:
  evolution_loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install solana solders httpx requests pyTelegramBotAPI

      - name: Run Swarm Core Logic
        env:
          ALL_REPOS_SECRETS: ${{ toJson(secrets) }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -f "swarm_core.py" ]; then
            python swarm_core.py
          elif [ -f "src/swarm_core.py" ]; then
            python src/swarm_core.py
          else
            echo "⚠️ Скрипт swarm_core.py не найден, пропуск запуска логики."
          fi

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # # 1. Ежёныш изолирует результаты текущего раунда во временный буфер
          mkdir -p /tmp/ezhenysh_buffer
          cp index.html /tmp/ezhenysh_buffer/index.html_backup 2>/dev/null || true
          cp history_log.json /tmp/ezhenysh_buffer/history_log.json_backup 2>/dev/null || true

          # # 2. Жесткая очистка локального поля ДО коммита, синхронизация с сервером
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          # # 3. Возвращаем сгенерированные файлы на очищенное поле
          if [ -d "/tmp/ezhenysh_buffer" ]; then
            cp /tmp/ezhenysh_buffer/index.html_backup index.html 2>/dev/null || true
            cp /tmp/ezhenysh_buffer/history_log.json_backup history_log.json 2>/dev/null || true
          fi

          # # 4. Фиксация шага и принудительное запечатывание истории
          git add index.html 2>/dev/null || true
          git add history_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✨ Изменений нет. Пропуск пуша."
          else
            # Добавление [skip ci] разрывает петлю бесконечного самострела экшена!
            git commit -m "🦔 AMRITA: Ezhenysh swarm step sealed [skip ci]"
            git push origin main --force
            echo "✅ Эволюционный сдвиг принудительно зафиксирован в Мультивселенной!"
          fi
          
          rm -rf /tmp/ezhenysh_buffer
