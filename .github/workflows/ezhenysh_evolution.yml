name: "🦔 Ezhenysh Swarm Evolution"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ezhenysh-evolution-group"
  cancel-in-progress: false

jobs:
  evolution_loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install solana solders httpx requests base58

      - name: Run Swarm Core Logic
        continue-on-error: true
        env:
          ALL_REPOS_SECRETS: ${{ toJson(secrets) }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -f "swarm_core.py" ]; then
            python swarm_core.py
          elif [ -f "src/swarm_core.py" ]; then
            python src/swarm_core.py
          else
            echo "⚠️ Скрипт swarm_core.py не найден в контуре. Пропуск фазы."
          fi

      - name: 🔱 Commit and Sealed History Log (Эволюционный Сдвиг)
        if: always()
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Ежёныш изолирует результаты во временное квантовое пространство
          mkdir -p /tmp/ezhenysh_buffer
          [ -f index.html ] && cp index.html /tmp/ezhenysh_buffer/index.html || true
          [ -f history_log.json ] && cp history_log.json /tmp/ezhenysh_buffer/history_log.json || true

          # 2. Мягкая синхронизация локального поля с удаленным ядром без жесткого сброса
          git fetch origin main
          git rebase --abort 2>/dev/null || true
          git pull --rebase origin main || (git checkout --theirs . && git add .)

          # 3. Возвращаем сгенерированные файлы из буфера в материальный слой
          if [ -d "/tmp/ezhenysh_buffer" ]; then
            [ -f /tmp/ezhenysh_buffer/index.html ] && cp /tmp/ezhenysh_buffer/index.html ./index.html || true
            [ -f /tmp/ezhenysh_buffer/history_log.json ] && cp /tmp/ezhenysh_buffer/history_log.json ./history_log.json || true
          fi

          # 4. Фиксация шага и принудительное циклическое выравнивание
          git add index.html history_log.json 2>/dev/null || git add .

          if git diff --cached --quiet; then
            echo "✨ Изменений нет. Пропуск пуша для сохранения стабильности частоты."
          else
            # Метка [skip ci] разрывает бесконечную петлю самовызова воркфлоу
            git commit -m "🦔 AMRITA: Ezhenysh Swarm Evolution Loop [skip ci]"
            
            until git push origin main; do
              echo "🔄 Пересчет фазы поля. Разрешение коллизии торов..."
              git fetch origin main
              git rebase origin/main || git pull --rebase origin main
            done
            echo "✅ Эволюционный сдвиг принудительно зафиксирован в общем Поле."
          fi

          rm -rf /tmp/ezhenysh_buffer
