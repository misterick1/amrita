name: 🦔 AMRITA Swarm Core Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ezhenysh-run-group"
  cancel-in-progress: false

jobs:
  deploy_and_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python Realities
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Vision (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py pillow pytesseract solana solders httpx base58 requests matplotlib numpy

      - name: Fix Swarm Paths & Run Core
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
          OAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -d "src/src" ]; then
            mv src/src/* src/ || true
            rm -rf src/src
          fi

          if [ -f "butterfly_core.py" ]; then mv butterfly_core.py src/ 2>/dev/null || true; fi
          if [ -f "ezhenysh_discord.py" ]; then mv ezhenysh_discord.py src/ 2>/dev/null || true; fi

          if [ -f "src/butterfly_core.py" ]; then python src/butterfly_core.py; fi
          if [ -f "src/swarm_meme_core.py" ]; then python src/swarm_meme_core.py; fi

          if [ -f "src/ezhenysh_discord.py" ]; then
            python src/ezhenysh_discord.py &
            sleep 5
          fi

      - name: Commit & Push Web Layer Data (Тороидальный Волновод)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add docs/data.json history_log.json docs/quantum_attractor.png index.html 2>/dev/null || git add .
          
          if git diff --staged --quiet; then
            echo "✨ Изменений в слое данных нет."
          else
            git commit -m "🔱 Каузальный апдейт матрицы: Квантовые аттракторы и данные сбалансированы [skip ci]"
            
            until git push origin main; do
              echo "🔄 Синхронизация волновых функций репозитория..."
              git fetch origin main
              git rebase origin/main || git pull --rebase origin main
            done
          fi

      - name: 🧹 АННИГИЛЯЦИЯ МАТЕРИАЛЬНОГО КЭША
        if: always()
        run: |
          echo "🧹 Очистка физического слепка диска контейнера..."
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf ~/.cache/pip /tmp/* 2>/dev/null || true
          sudo apt-get clean || true
          echo "✅ Пространство полностью освобождено."
