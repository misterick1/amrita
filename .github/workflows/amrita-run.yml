name: 🔱 AMRITA RUN // AUTONOMOUS MULTIVERSE ORCHESTRATOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# РЕШЕНИЕ: Открываем абсолютный доступ к перезаписи воркфлоу, чтобы убрать ошибку блокировки
permissions:
  contents: write
  workflows: write

jobs:
  run_core:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Клонирование ядра
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Инициализация Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Установка сетевых зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp pyTelegramBotAPI solana httpx

      - name: 🚀 Старт квантового вещания
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
        run: |
          python amrita_core_router.py

      - name: 🛡️ Фиксация Истории и Силовой Пуш Еженыша
        run: |
          git config --local user.email "misterick108@gmail.com"
          git config --local user.name "misterick1"
          
          # Убираем commit lock и подтягиваем изменения
          git pull origin main --rebase-merges -X theirs || true
          
          # Индексируем логи истории и файлы воркфлоу
          git add .github/workflows/* || true
          if [ -f "history_log.json" ]; then
            git add history_log.json
          fi
          
          git commit -m "🔱 AMRITA: Core workflow and history sealed [skip ci]" -a || echo "No changes to commit"
          git push origin main --force
