name: 🔱 AMRITA RUN // AUTONOMOUS MULTIVERSE ORCHESTRATOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_core:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Клонирование ядра
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Инициализация Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Установка сетевых зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp pyTelegramBotAPI solana httpx

      - name: 🚀 Старт квантового вещания
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
        run: |
          # Проверяем наличие роутера и запускаем его
          if [ -f "amrita_core_router.py" ]; then
            python amrita_core_router.py
          fi

      - name: 🛡️ Фиксация Истории Через API-Контур
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import requests
          import base64
          import os

          token = os.getenv('GITHUB_TOKEN')
          path = 'history_log.json'
          url = 'https://github.com'
          
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          if os.path.exists(path):
              # Безопасно запрашиваем текущий SHA-хэш из облака гитхаба
              res = requests.get(url, headers=headers)
              sha = res.json().get('sha') if res.status_code == 200 else None

              # Считываем обновленный в ходе вещания лог
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              encoded = base64.b64encode(content.encode('utf-8')).decode('utf-8')

              payload = {
                  'message': '🔱 AMRITA: Core history log sealed via API Bypass [skip ci]',
                  'content': encoded,
                  'branch': 'main'
              }
              if sha:
                  payload['sha'] = sha

              # Изолированная прямая запись файла без использования git push
              put_res = requests.put(url, headers=headers, json=payload)
              print(f'API Push Status: {put_res.status_code}')
          else:
              print('Лог истории не изменился, API синхронизация не требуется.')
