name: 🔱 AMRITA RUN // AUTONOMOUS MULTIVERSE ORCHESTRATOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# РЕШЕНИЕ: Оставлен только стандартный, поддерживаемый гитхабом ключ доступа
permissions:
  contents: write

jobs:
  run_core:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Клонирование ядра
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Инициализация Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Установка сетевых зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp pyTelegramBotAPI solana httpx

      - name: 🚀 Старт квантового вещания
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
        run: |
          python amrita_core_router.py

      - name: 🛡️ Фиксация Истории и Безопасный Пуш
        run: |
          git config --local user.email "misterick108@gmail.com"
          git config --local user.name "misterick1"
          
          # Жестко забираем изменения из веб-интерфейса телефона, перезаписывая локальный шум
          git fetch origin main
          git reset --soft origin/main
          
          # Индексируем только файл истории, не трогая защищенную папку воркфлоу
          if [ -f "history_log.json" ]; then
            git add history_log.json
          fi
          
          # Закрываем трансляцию коммитом
          git commit -m "🔱 AMRITA: Core history log sealed [skip ci]" -a || echo "No changes to commit"
          
          # Пушим лог в ветку main
          git push origin main
