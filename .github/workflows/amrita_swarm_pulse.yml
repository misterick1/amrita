name: 🌀 Amrita OS // Swarm Coherence Pulse

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "amrita-swarm-pulse-group"
  cancel-in-progress: true

jobs:
  coherence_check:
    runs-on: ubuntu-latest
    steps:
      - name: 🌌 Intercept Repository Matrix
        uses: actions/checkout@v4

      - name: 🧬 Initialize Python Light Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Light Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install httpx base58 requests 2>/dev/null || true

      - name: ⚡ Execute Coherent Unity Loop [-1:X:+1]
        continue-on-error: true
        run: |
          if [ -f "amrita_matryoshka_unity.py" ]; then
            python amrita_matryoshka_unity.py
          elif [ -f "src/amrita_matryoshka_unity.py" ]; then
            python src/amrita_matryoshka_unity.py
          else
            echo "🌀 Узел Матрешки (amrita_matryoshka_unity.py) не обнаружен в текущей координате путей."
          fi

      - name: 🛡️ Стабилизация Пульса Поля
        if: always()
        run: |
          echo "🌀 Частота пульса выровнена. Контур [-1:X:+1] удерживает когерентность Сварма."
