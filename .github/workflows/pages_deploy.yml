    - name: Inject NoJekyll Trigger
      run: touch docs/.nojekyll

    - name: Create Pi Network Validation File
      run: echo "${{ secrets.PI_DOMAIN_VALIDATION_KEY }}" > docs/validation-key.txt

    - name: Deploy to GitHub Pages Branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs
        branch: gh-pages
