name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'src/pifi_bridge.py'
      - 'src/github_repairman.py'
      - '.github/workflows/amrita-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ПРИНУДИТЕЛЬНЫЙ СБРОС ПРОБКИ: Убивает старые зависшие процессы деплоя
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Quantum Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run AMRITA OS Repairman
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "src/github_repairman.py" ]; then
            python src/github_repairman.py
          fi

      - name: Inject NoJekyll & Pi Network Validation File
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          touch .nojekyll
          if [ -n "${{ secrets.PI_DOMAIN_VALIDATION_KEY }}" ]; then
            echo "${{ secrets.PI_DOMAIN_VALIDATION_KEY }}" > docs/validation-key.txt
            echo "${{ secrets.PI_DOMAIN_VALIDATION_KEY }}" > validation-key.txt
          fi

      - name: Compile Emerald Core Data
        run: |
          if [ -f "src/pifi_bridge.py" ]; then
            python src/pifi_bridge.py
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
