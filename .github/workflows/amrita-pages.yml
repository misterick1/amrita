name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Явные права для сброса токенов и очистки очереди деплоя
permissions:
  contents: read
  pages: write
  id-token: write

# Автоматически отменяет старые зависшие сборки в этой же очереди
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг генерации статики для amrita-mir.com (если используется скрипт)
      - name: Compile Emerald Core Data
        run: |
          if [ -f "src/pifi_bridge.py" ]; then python src/pifi_bridge.py; fi

      # Сборка артефакта страниц (укажите вашу директорию сайта, если это не корень)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      # Физический деплой с принудительным перехватом зависшего порта
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
