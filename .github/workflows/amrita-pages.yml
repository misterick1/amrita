name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'src/pifi_bridge.py'
      - '.github/workflows/amrita-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ПРИНУДИТЕЛЬНЫЙ СБРОС ПРОБКИ: Убивает старые зависшие процессы деплоя
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Emerald Core Data
        run: |
          if [ -f "src/pifi_bridge.py" ]; then
            python src/pifi_bridge.py
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
