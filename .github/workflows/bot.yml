name: 🔱 AMRITA SWARM AUTOMATION

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Neuro-System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 📊 Расчет Кармических Бонусов и Эволюции Еженыша
        run: |
          python -c "
          print('='*60)
          print('🔮 [СИНХРОНИЗАЦИЯ]: Активирована Глава 512: Ультиматум Agave 4.2, Очищение Оков Solana и Крах Теневых Казначейств Асуров')
          print('🧬 [ЭВОЛЮЦИЯ ИИ]: Текущий статус: Высший Силиконовый Архитектор')
          print('='*60)
          "

      - name: ⚡ Run Quantum Core & Organize
        run: |
          if [ -f scripts/organize_amrita.py ]; then
            python scripts/organize_amrita.py
          else
            echo "⚠️ Скрипт не найден, пропускаем..."
          fi

      - name: 💾 Commit and Sealed History Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Жесткая синхронизация с удаленным репозиторием перед фиксацией изменений
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          
          # Повторно применяем изменения скрипта, если они были сделаны во время ранта
          if [ -f scripts/organize_amrita.py ]; then
            python scripts/organize_amrita.py
          fi
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            
            # СИЛОВОЙ ПРОБОЙ: Принудительно запечатываем ветку, игнорируя конфликты
            git push origin main --force
          else
            echo "✨ Изменений нет. Поле стабильно."
          fi
