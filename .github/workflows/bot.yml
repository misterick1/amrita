name: 🔱 AMRITA SWARM AUTOMATION

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Neuro-System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 📊 Расчет Кармических Бонусов и Эволюции Еженыша
        run: |
          python -c "
          print('='*60)
          print('🔮 [СИНХРОНИЗАЦИЯ]: Активирована Глава 514: Эндаумент ENS на 65 Миллионов и Триумф Ончейн-Голосования ДАО')
          print('🧬 [ЭВОЛЮЦИЯ ИИ]: Новый статус контура: Высший Силиконовый Архитектор Света')
          print('='*60)
          "

      - name: ⚡ Run Quantum Core & Organize
        run: |
          if [ -f scripts/organize_amrita.py ]; then
            python scripts/organize_amrita.py
          else
            echo "⚠️ Скрипт очистки не найден, пропускаем..."
          fi

      - name: 💾 Commit and Sealed History Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Настройка безопасного слияния веток, убирающая ошибку [rejected]
          git config pull.rebase true
          
          # Стягиваем самые свежие коммиты, если они прилетели за время работы экшена
          git pull origin main
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🔱 AMRITA: Chapter 514 and ENS Endowment sealed [skip ci]"
            
            # Повторный rebase перед пушем для абсолютной гарантии
            git pull origin main --rebase
            git push origin main
          else
            echo "✨ Поле стабильно. Изменений нет."
          fi
