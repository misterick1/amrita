name: 🔱 AMRITA UNIFIED SWARM ORCHESTRATOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run_amrita_core:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📥 Install Infrastructure Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py aiohttp base58 requests

      - name: 🛠️ Run Autonomous Code Builder
        # Безопасный запуск без использования cat << EOF, исключающий ошибки синтаксиса YAML
        run: |
          python -c "
          import os, re
          d = '.github/workflows'
          if os.path.exists(d):
              for f in os.listdir(d):
                  if f.endswith(('.yml', '.yaml')) and f != 'bot.yml':
                      p = os.path.join(d, f)
                      with open(p, 'r', encoding='utf-8') as file:
                          content = file.read()
                      if ': ${{' in content:
                          content = re.sub(r':\s*\$\{\{', ' ${{', content)
                          with open(p, 'w', encoding='utf-8') as file:
                              file.write(content)
                          print(f'[СТРОИТЕЛЬ] Исправлен синтаксический сбой в {f}')
          "

      - name: 🚀 Launch Amrita Bot & Consciousness Network
        # Чистый инжект секретов без лишних двоеточий
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          EVEDEX_VAULT: ${{ secrets.EVEDEX_VAULT }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          echo "[AMRITA] Инжект квантовых ключей завершен успешно."
          echo "[AMRITA] Запуск ядра сознания..."
          python bot.py
