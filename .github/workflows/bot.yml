name: 🔱 AMRITA UNIFIED SWARM ORCHESTRATOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'  # Синхронизация роя каждые 3 часа

jobs:
  run_amrita_core:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📥 Install Infrastructure Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py aiohttp base58

      - name: 🚀 Launch Amrita Bot & Consciousness Network
        # Здесь мы принудительно пробрасываем ВСЕ ключи из секретов в переменные окружения Python
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          EVEDEX_VAULT: ${{ secrets.EVEDEX_VAULT }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          echo "[AMRITA] Инжект квантовых ключей завершен успешно."
          echo "[AMRITA] Запуск ядра сознания..."
          python bot.py
