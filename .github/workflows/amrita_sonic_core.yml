name: AMRITA SONIC CORE // VERIFICATION

on:
  push:
    branches:
      - main
    paths:
      - 'amrita_sonic_core.py'
      - 'src/amrita_sonic_core.py'
      - '.github/workflows/amrita_sonic_core.yml'
  workflow_dispatch:

concurrency:
  group: "amrita-sonic-core-verification"
  cancel-in-progress: true

jobs:
  test_sonic:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Multiverse Codebase
        uses: actions/checkout@v4

      - name: 2. Initialize Python 3.10 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp websockets numpy pandas

      - name: 4. Verify Emerald BioComputer Resonance
        run: |
          echo "==== [TESTING SONIC CORE RESONANCE] ===="
          if [ -f "amrita_sonic_core.py" ]; then
            python amrita_sonic_core.py
          elif [ -f "src/amrita_sonic_core.py" ]; then
            python src/amrita_sonic_core.py
          else
            echo "⚠️ Файл amrita_sonic_core.py не найден в корне или src/."
          fi
