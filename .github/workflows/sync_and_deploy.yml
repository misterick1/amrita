name: sync_and_deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-deploy-group"
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Проверяем файлы индексов или логов, которые вы меняете
          git add -A
          git diff-index --quiet HEAD || git commit -m "[main] chore: sealed history log and book index stabilization [skip ci]"
          
          # Цикл пробития блокировки refs/heads/main
          for i in {1..5}; do
            git pull origin main --rebase && git push origin main && exit 0
            echo "Конфликт блокировки репозитория. Повторная попытка через 5 секунд..."
            sleep 5
          done
          exit 1
