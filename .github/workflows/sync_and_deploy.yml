name: sync_and_deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI

      - name: Execute Swarm Core Sync
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=.
          # Точный запуск из папки src/
          if [ -f "amrita/src/sync_partners.py" ]; then
              python amrita/src/sync_partners.py
          elif [ -f "src/sync_partners.py" ]; then
              python src/sync_partners.py
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@://github.com"
          git config --local user.name "misterick1"
          
          git add history_log.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
              echo "✨ Изменений в истории логов нет."
              exit 0
          fi
          
          git commit -m "🔱 AMRITA: Quantum stack history lock [skip ci]"
          git push origin main
