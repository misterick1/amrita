name: Autonomous Partner Sync

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 */3 * * *" # Сбалансированный запуск каждые 3 часа
  workflow_dispatch: # Кнопка для ручного запуска

concurrency:
  group: "swarm-sync-group"
  cancel-in-progress: true

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7 # Жесткий предохранитель от бесконечного зависания
    
    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies and Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests solana solders aiohttp

      - name: Execute Swarm Core Sync
        env:
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          LEFT_WING_KEY: ${{ secrets.LEFT_WING_KEY }}
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_WALLET_PRIVATE_KEY: ${{ secrets.PI_WALLET_PRIVATE_KEY }}
          SERVER_1: ${{ secrets.SERVER_1 }}
          SERVER_2: ${{ secrets.SERVER_2 }}
          SERVER_3: ${{ secrets.SERVER_3 }}
          SERVER_4: ${{ secrets.SERVER_4 }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SWARM_ORACLE_KEY: ${{ secrets.SWARM_ORACLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          export PYTHONPATH=.
          if [ -f "tools/deploy_sync.py" ]; then python tools/deploy_sync.py; fi
          if [ -f "sync_partners.py" ]; then python sync_partners.py; fi
          if [ -f "tools/quantum_bridge.py" ]; then python tools/quantum_bridge.py; fi
          python -m src.ezhenysh_bot --mode=bot
          if [ -f "src/regulatory_override_shield.py" ]; then python src/regulatory_override_shield.py; fi

      - name: Mirror Web Interfaces (Root to Docs)
        run: |
          if [ -f "index.html" ]; then
            mkdir -p docs
            cp index.html docs/index.html
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@yandex.ru"
          git config --local user.name "misterick1"
          git config --local pull.rebase true

          # Проверяем наличие изменений, созданных ИИ-ботом
          if [ -n "$(git status --porcelain)" ]; then
            # Добавляем все измененные логи и файлы
            git add -A
            
            # Локальный коммит ДО стягивания, чтобы Git знал, что объединять
            git commit -m "chore: sealed history log and matrix stabilization [skip ci]"
            
            # КВАНТОВОЕ СЛИЯНИЕ: Стягиваем твои коммиты с телефона прямо перед пушем.
            # Флаг -X ours автоматически разрешит конфликты в JSON в пользу данных бота.
            git pull origin main --rebase -X ours || git pull origin master --rebase -X ours
            
            # Финальный защищенный пуш монолитной волны
            git push origin main || git push origin master
          else
            echo "🔱 Локальное поле стабильно. Новых изменений для коммита нет."
          fi
