name: sync_and_deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy_and_run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Job
        run: echo "🚀 Запуск горячего старта deploy_and_run..."

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Realities
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Vision (Tesseract OCR)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Полное подавление интерактивных запросов и таймаутов матрицы
          sudo apt-get update -y -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI pytesseract pillow

      - name: Fix Swarm Paths & Run Core
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=.
          if [ -f "amrita/src/sync_partners.py" ]; then
              python amrita/src/sync_partners.py
          elif [ -f "src/sync_partners.py" ]; then
              python src/sync_partners.py
          fi

      - name: Commit & Push Web Layer Data
        run: |
          git config --local user.email "misterick1@://github.com"
          git config --local user.name "misterick1"
          git add history_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
              echo "✨ Изменений в логах нет. Пропуск."
              exit 0
          fi
          git commit -m "🔱 AMRITA: Deploy & Run sync [skip ci]"
          git push origin main
