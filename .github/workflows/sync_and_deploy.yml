name: sync_and_deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-deploy-group"
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI solana

      - name: Execute Swarm Core Sync
        id: run_core
        continue-on-error: true
        run: |
          # Запуск мультиверс-оркестратора
          if [ -f "src/multiverse_orchestrator.py" ]; then
            python src/multiverse_orchestrator.py
          elif [ -f "multiverse_orchestrator.py" ]; then
            python multiverse_orchestrator.py
          fi
          
          # Запуск скрипта партнеров
          if [ -f "amrita/sync_partners.py" ]; then
            python amrita/sync_partners.py
          elif [ -f "sync_partners.py" ]; then
            python sync_partners.py
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # Бэкап свежих файлов индексов и логов
          mkdir -p /tmp/amrita_backup
          cp index.html /tmp/amrita_backup/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_backup/ 2>/dev/null || true

          # Сброс локального состояния до сервера, чтобы избежать конфликтов
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          # Возврат актуальных логов из бэкапа
          if [ -d "/tmp/amrita_backup" ]; then
            cp -r /tmp/amrita_backup/* ./ 2>/dev/null || true
          fi

          # Проверяем файлы индексов или логов, которые изменились
          git add index.html 2>/dev/null || true
          git add history_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✨ Изменений в истории логов нет. Пропуск коммита."
            rm -rf /tmp/amrita_backup
            exit 0
          fi

          # Метка [skip ci] разрывает бесконечную петлю самозапуска экшенов
          git commit -m "🔱 AMRITA: Quantum stack history logs sealed [skip ci]"

          # Ваш цикл пробития блокировки refs/heads/main
          success=false
          for i in {1..5}; do
            echo "Попытка пробития блокировки репозитория #$i..."
            git pull origin main --rebase -X theirs && git push origin main && { success=true; break; }
            echo "Конфликт блокировки репозитория. Повтор через 5 секунд..."
            sleep 5
          done

          rm -rf /tmp/amrita_backup

          # Если пуш не удался после 5 попыток — завершаем с ошибкой, если удался — выходим чисто (0)
          if [ "$success" = false ]; then
            echo "❌ Не удалось пробить блокировку репозитория."
            exit 1
          fi
          echo "🟢 Эволюция успешно запечатана в репозиторий!"
