name: sync_and_deploy

on:
  workflow_dispatch:

concurrency:
  group: amrita-sync-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy_and_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Vision (Tesseract)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Полное подавление интерактивных запросов
          sudo apt-get update --fix-missing -y || (sleep 10 && sudo apt-get update --fix-missing -y)
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 tesseract-ocr tesseract-ocr-rus libtesseract-dev

      - name: Install Dependencies and Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI pillow pytesseract

      - name: Execute Swarm Core Sync
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          export PYTHONPATH=.
          # Точный автоматический запуск скрипта
          if [ -f "amrita/src/sync_partners.py" ]; then
            python amrita/src/sync_partners.py
          elif [ -f "src/sync_partners.py" ]; then
            python src/sync_partners.py
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          git add history_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✨ Изменений в истории логов не обнаружено."
            exit 0
          fi

          git commit -m "🔱 AMRITA: Complete mainnet stabilization [skip ci]"

          # Синхронизация веток с защитой от конфликтов
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || (git rebase --abort && git pull -X theirs origin main)
            if git push origin main; then
              break
            fi
            sleep 3
          done
