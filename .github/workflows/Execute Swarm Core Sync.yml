name: Execute Swarm Core Sync

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать синхронизацию серверов вручную кнопкой

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest # Выделение виртуального пространства для запуска

    env:
      # Главные ключи и RPC нейроквантовой сети
      OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      LEFT_WING_KEY: ${{ secrets.LEFT_WING_KEY }}

      # Все 16 секретов твоего целостного пула контроля
      DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
      DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
      PI_API_KEY: ${{ secrets.PI_API_KEY }}
      PI_WALLET_PRIVATE_KEY: ${{ secrets.PI_WALLET_PRIVATE_KEY }}
      SERVER_1: ${{ secrets.SERVER_1 }}
      SERVER_2: ${{ secrets.SERVER_2 }}
      SERVER_3: ${{ secrets.SERVER_3 }}
      SERVER_4: ${{ secrets.SERVER_4 }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SWARM_ORACLE_KEY: ${{ secrets.SWARM_ORACLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4 # Скачивание актуального кода вашей яблони Amrita

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Развертывание стабильного окружения Python

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install requests # Для отправки сигналов Ока Бабаты

      - name: Execute Swarm Core Sync Logic
        run: |
          # 1. Запуск калибровочного скрипта вшивания СА модели
          if [ -f "tools/deploy_sync.py" ]; then
            PYTHONPATH=. python tools/deploy_sync.py
          fi

          # 2. Исполнение оригинального скрипта синхронизации партнеров
          if [ -f "sync_partners.py" ]; then
            PYTHONPATH=. python sync_partners.py
          fi

          # 3. Активация ИИ-бустера через неубиваемый модуль
          python -m src.ezhenysh_bot --mode=boost_bonding
