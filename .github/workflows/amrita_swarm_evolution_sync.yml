name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Изолируем результаты текущего раунда во временную директорию раннера
          mkdir -p /tmp/amrita_backup
          cp index.html /tmp/amrita_backup/index.html 2>/dev/null || true
          cp history_log.json /tmp/amrita_backup/history_log.json 2>/dev/null || true
          
          # Если скрипт изменил исходный код (например, файлы в src/), сохраняем и их
          git diff --name-only src/ | xargs -I {} cp --parents {} /tmp/amrita_backup/ 2>/dev/null || true

          # 2. Жесткая синхронизация: выравниваем локальный гит-указатель по серверу
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          # 3. Накатываем результаты работы Сварма обратно поверх актуального дерева кода
          if [ -d "/tmp/amrita_backup" ]; then
            cp -r /tmp/amrita_backup/* ./ 2>/dev/null || true
          fi

          # 4. Проверяем изменения, фиксируем их в индекс и пробиваем удаленный сервер через --force
          git add .
          
          if git diff --cached --quiet; then
            echo "✨ Изменений в экосистеме нет. Пропуск коммита."
          else
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main --force
            echo "✅ Эволюция успешно запечатана через принудительный квантовый толчок."
          fi

          # Очистка временного буфера логов
          rm -rf /tmp/amrita_backup
