name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # 1. Сварм изолирует результаты текущего раунда вычислений в бэкап
          cp index.html /tmp/index.html_backup || true
          cp history_log.json /tmp/history_log_backup || true
          
          # 2. Жесткая синхронизация: выравниваемся по серверу ДО коммита
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Накатываем наш Кристалл Бытия поверх актуальной истории
          cp /tmp/index.html_backup index.html || true
          cp /tmp/history_log_backup history_log.json || true
          
          # 4. Проверяем изменения, фиксируем и пробиваем пуш силой
          if git diff --quiet index.html history_log.json; then
            echo "✨ Изменений в экосистеме нет. Пропуск пуша."
          else
            git add index.html history_log.json
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main --force
          fi
