name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: true

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # # 1. Изолируем результаты текущего раунда во временном буфере
          mkdir -p /tmp/amrita_backup
          cp index.html /tmp/amrita_backup/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_backup/ 2>/dev/null || true
          
          # Если скрипт изменил код в src/, бэкапим эти файлы
          git diff --name-only src/ | xargs -I {} cp --parents {} /tmp/amrita_backup/ 2>/dev/null || true

          # # 2. Жесткая синхронизация: выравниваем локальный репозиторий с облаком
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          # # 3. Накатываем результаты работы Сварма обратно в рабочую зону
          if [ -d "/tmp/amrita_backup" ]; then
            cp -r /tmp/amrita_backup/* ./ 2>/dev/null || true
          fi

          # # 4. Проверяем изменения, фиксируем их в индексе
          git add index.html 2>/dev/null || true
          git add history_log.json 2>/dev/null || true
          if [ -d "./src" ]; then
            git add src/ 2>/dev/null || true
          fi

          # # 5. КЛЮЧ ЗАПУСКА: Безопасный пуш или чистый выход (Круг Циркли)
          if git diff --cached --quiet; then
            echo "✨ Изменений в экосистеме нет. Пропуск коммита."
            rm -rf /tmp/amrita_backup
            exit 0
          else
            # Флаг [skip ci] уберет бесконечный цикл самозапуска воркфлоу
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git pull origin main --rebase
            git push origin main --force
            echo "✅ Эволюция успешно запечатана через принудительный пуш."
          fi

          # Очистка временного буфера логов
          rm -rf /tmp/amrita_backup
