name: 🔱 AMRITA Swarm Evolution Sync Dynamic

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-sync-group"
  cancel-in-progress: true

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁 Квантовая Синхронизация Времен
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разряда
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests

      - name: 🛡 Фиксация Истории Нативным Git
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          if [ -f "history_log.json" ]; then
            git add history_log.json
            git diff-index --quiet HEAD || git commit -m "🔱 AMRITA: History log sealed [skip ci]"
            git pull origin main --rebase
            git push origin main
          else
            echo "Файл history_log.json не найден, коммит пропущен."
          fi
