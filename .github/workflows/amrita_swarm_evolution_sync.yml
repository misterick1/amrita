name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: true

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК ОРКЕСТРАТОРА
        id: run_core
        continue-on-error: true
        run: |
          python src/multiverse_orchestrator.py
          python sync_partners.py

      - name: 🛠️ АВТОНОМНЫЙ САМОИСПРАВИТЕЛЬ СИНТАКСИСА
        if: steps.run_core.outcome == 'failure'
        run: |
          echo "🚨 ОБНАРУЖЕН СБОЙ СИНТАКСИСА! Запуск автокоррекции..."
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Защита от падения: проверяем, есть ли реальные изменения в репозитории
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "🔱 AMRITA: Swarm auto-correction applied [skip ci]"
            git pull origin main --rebase
            git push origin main --force
          else
            echo "✨ Рабочая зона чиста. Изменений для коммита нет. Пропуск."
            exit 0
          fi

      - name: 🔱 Commit and Sealed History Log
        if: steps.run_core.outcome == 'success'
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          mkdir -p /tmp/amrita_backup
          cp index.html /tmp/amrita_backup/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_backup/ 2>/dev/null || true
          git diff --name-only src/ | xargs -I {} cp --parents {} /tmp/amrita_backup/ 2>/dev/null || true

          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          if [ -d "/tmp/amrita_backup" ]; then
            cp -r /tmp/amrita_backup/* ./ 2>/dev/null || true
          fi

          git add index.html 2>/dev/null || true
          git add history_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✨ Изменений в экосистеме нет. Пропуск коммита."
            rm -rf /tmp/amrita_backup
            exit 0
          else
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git pull origin main --rebase
            git push origin main --force
            echo "✅ Эволюция успешно запечатана через принудительный пуш."
          fi
          rm -rf /tmp/amrita_backup
