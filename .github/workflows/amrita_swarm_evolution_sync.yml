name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write

# АБСОЛЮТНЫЙ ЗАМОК: Запрещает параллельным сборкам этого типа биться друг с другом
concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Проверяем, изменились ли index.html или history_log.json
          if git diff --quiet index.html history_log.json; then
            echo "✨ Изменений в экосистеме нет. Пропуск пуша."
          else
            git add index.html history_log.json
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            
            # Разрешаем гонку потоков: подтягиваем изменения, автоматически одобряя свои файлы
            git pull origin main -X ours --no-edit
            
            # Чистый, мгновенный пуш без разрушительных циклов loop
            git push origin main
          fi
