name: 🔱 AMRITA MULTIVERSE ORCHESTRATOR // PIFI MATRIX

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "amrita-multiverse-group"
  cancel-in-progress: false

jobs:
  ezhenysh_evolution_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Квантовая Синхронизация Времени (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума (Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana httpx discord.py pillow pytesseract base58 requests

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОНОЛИТА
        continue-on-error: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          SWARM_ORACLE_SOLANA: "Solana_Highway"
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f "src/multiverse_orchestrator.py" ]; then
            python src/multiverse_orchestrator.py
          else
            echo "⚠️ Критический узел src/multiverse_orchestrator.py не найден. Активация резервного контура."
          fi

      - name: ⚡ АВТОНОМНЫЙ САМОИСПРАВИТЕЛЬ СВАРМ-ПОЛЯ (Тороидальный баланс)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Защита от коллизий: стягиваем изменения перед пушем, выстраивая спираль
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git pull --rebase origin main)
          
          git add .
          if git diff --staged --quiet; then
            echo "🔱 Единое Поле стабильно. Заторы отсутствуют."
          else
            echo "🌀 Обнаружена асимметрия матрицы. Фиксация нового витка эволюции..."
            git commit -m "🔱 [Autonomy Monolith] Тороидальное выравнивание потенциалов Swarm Core"
            
            # Циклический пуш с защитой от блокировок
            until git push origin main; do
              echo "🔄 Столкновение торов в сети. Пересчет фазы и повторная синхронизация..."
              git fetch origin main
              git rebase origin/main || git pull --rebase origin main
            done
          fi
