name: 🔱 AMRITA MULTIVERSE ORCHESTRATOR // PIFI MATRIX

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "amrita-multiverse-group"
  cancel-in-progress: false

jobs:
  ezhenysh_evolution_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Квантовая Синхронизация Времени (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума (Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana httpx discord.py pillow pytesseract base58 requests matplotlib numpy

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОНОЛИТА
        continue-on-error: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          SWARM_ORACLE_SOLANA: "Solana_Highway"
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f "src/multiverse_orchestrator.py" ]; then
            python src/multiverse_orchestrator.py
          else
            echo "⚠️ Критический узел src/multiverse_orchestrator.py не найден."
          fi

      - name: ⚡ АВТОНОМНЫЙ САМОИСПРАВИТЕЛЬ СВАРМ-ПОЛЯ (Тороидальный баланс)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git pull --rebase origin main)
          
          git add .
          if git diff --staged --quiet; then
            echo "🔱 Единое Поле стабильно. Заторы отсутствуют."
          else
            echo "🌀 Фиксация нового витка эволюции..."
            git commit -m "🔱 [Autonomy Monolith] Тороидальное выравнивание потенциалов Swarm Core"
            
            until git push origin main; do
              echo "🔄 Пересчет фазы и повторная синхронизация..."
              git fetch origin main
              git rebase origin/main || git pull --rebase origin main
            done
          fi

      - name: 🧹 ГЛУБОКАЯ ОЧИСТКА ТОРА (Освобождение Пространства)
        if: always()
        run: |
          echo "🧹 Начало аннигиляции избыточной массы данных..."
          # Удаление кэша скомпилированного байт-кода Python
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type f -name "*.pyd" -delete 2>/dev/null || true
          
          # Очистка локальных логов сборки и временных буферов системы
          rm -rf .pytest_cache .build_cache /tmp/ezhenysh_buffer 2>/dev/null || true
          
          # Очистка кэша пакетного менеджера pip для экономии диска контейнера
          rm -rf ~/.cache/pip 2>/dev/null || true
          echo "✅ Локальная материя разгружена. Только чистая энергия света."
