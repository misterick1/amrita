name: Amrita Solana Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  solana-rpc-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Integrated Solana Scanner
      env:
        HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      run: |
        cat << 'EOF' > inline_scanner.py
        import os
        import sys
        import requests

        def run_scan():
            api_key = os.environ.get("HELIUS_API_KEY")
            if not api_key:
                print("ERROR: HELIUS_API_KEY is missing!")
                sys.exit(1)

            url = f"https://helius-rpc.com{api_key}"
            target_address = "J1toso1uCk3RLmjorhTthVwY9vK4WSS9A1s9RFRpatJ"

            payload = {
                "jsonrpc": "2.0",
                "id": "amrita-scan-v1",
                "method": "getTransactionsForAddress",
                "params": [
                    target_address,
                    {"limit": 3}
                ]
            }
            
            headers = {"Content-Type": "application/json"}
            print(f"Scanning address: {target_address}")
            
            try:
                response = requests.post(url, json=payload, headers=headers, timeout=15)
                response.raise_for_status()
                data = response.json()

                if "result" in data:
                    txs = data["result"]
                    print(f"Success! Found {len(txs)} transactions:")
                    for i, tx in enumerate(txs, 1):
                        sig = tx.get("signature", "unknown")
                        slot = tx.get("slot", "unknown")
                        print(f"  Tx #{i} | Slot: {slot} | https://solscan.io{sig}")
                else:
                    print("Empty result from RPC:", data)

            except Exception as error:
                print(f"RPC Request failed: {error}")
                sys.exit(1)

        if __name__ == "__main__":
            run_scan()
        EOF
        
        python inline_scanner.py
