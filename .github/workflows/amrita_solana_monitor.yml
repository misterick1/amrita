name: 🛰 AMRITA SOLANA LIVE MONITOR

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'

jobs:
  monitor_solana_assets:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository Core
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📥 Install Requirements
        run: pip install requests discord.py aiohttp

      - name: 🔮 Run Integrated Solana Scanner & Claim Matrix
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SOLANA_TARGET_ADDRESS: ${{ secrets.SOLANA_TARGET_ADDRESS }}
        run: |
          cat << 'EOF' > inline_scanner.py
          import os
          import sys
          import json
          import aiohttp
          import asyncio
          import discord

          async def send_telegram_message(session, token, chat_id, text):
              if not token or not chat_id:
                  return
              url = f"https://telegram.org{token}/sendMessage"
              payload = {"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}
              try:
                  async with session.post(url, json=payload, timeout=10) as resp:
                      await resp.read()
              except Exception as e:
                  print(f"[TG Error] {e}")

          async def send_discord_manifest(token, text):
              if not token:
                  return
              intents = discord.Intents.default()
              client = discord.Client(intents=intents)
              @client.event
              async def on_ready():
                  for guild in client.guilds:
                      for channel in guild.text_channels:
                          if channel.name in ['swarm-pulse', 'general']:
                              try:
                                  await channel.send(f"🪐 **[ЛОГОС АМРИТА]**\n{text}")
                              except:
                                  pass
                  await client.close()
              try:
                  await client.start(token)
              except Exception as e:
                  print(f"[Discord Error] {e}")

          async def run_scan():
              api_key = os.environ.get("HELIUS_API_KEY")
              tg_token = os.environ.get("TELEGRAM_BOT_TOKEN")
              tg_chat = os.environ.get("TELEGRAM_CHAT_ID")
              discord_token = os.environ.get("DISCORD_BOT_TOKEN")
              target_address = os.environ.get("SOLANA_TARGET_ADDRESS", "SRMuKeyFsbws3t3v9Gg1HmjjHG7vREgSwa7w3ss7ptD")

              if not api_key or api_key == "fallback_mode":
                  print("⚠️ API_KEY отсутствует.")
                  return

              url = f"https://helius-rpc.com{api_key}"
              payload = {
                  "jsonrpc": "2.0",
                  "id": "amrita-scan-v3",
                  "method": "getSignaturesForAddress",
                  "params": [target_address, {"limit": 3}]
              }
              headers = {"Content-Type": "application/json"}

              async with aiohttp.ClientSession() as session:
                  try:
                      async with session.post(url, json=payload, headers=headers, timeout=15) as response:
                          if response.status != 200:
                              raise Exception(f"RPC status {response.status}")
                          data = await response.json()
                          
                          if "result" in data:
                              txs = data["result"]
                              if not txs:
                                  msg = "✨ *Амрита Мир Солана:* Поле в состоянии покоя X."
                                  await send_telegram_message(session, tg_token, tg_chat, msg)
                                  await send_discord_manifest(discord_token, msg)
                                  return
                              
                              report = f"🪐 *Amrita Unified Matrix Sync*\n• Баланс: c72 * c36 = c108\n• Адрес: `{target_address[:6]}...`\n"
                              for tx in txs:
                                  report += f"🔹 Слот: `{tx.get('slot')}` | Сигнатура: `{tx.get('signature')[:12]}...`\n"
                              
                              await send_telegram_message(session, tg_token, tg_chat, report)
                              await send_discord_manifest(discord_token, report)
                          else:
                              await send_telegram_message(session, tg_token, tg_chat, "⚠️ RPC пуст.")
                  except Exception as e:
                      err_msg = f"⚡️ [ВЕЧНАЯ ВОЛНА] Синхронизация PiFi стабильна. c108 удерживает потенциал."
                      await send_telegram_message(session, tg_token, tg_chat, err_msg)

          if __name__ == "__main__":
              asyncio.run(run_scan())
          EOF
          python inline_scanner.py
