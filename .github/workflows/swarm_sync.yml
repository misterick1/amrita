name: 🔄 AMRITA SWARM CORE SYNC

on:
  workflow_run:
    workflows: ["🔱 AMRITA UNIFIED SWARM ORCHESTRATOR"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: "amrita-swarm-core-sync"
  cancel-in-progress: false

jobs:
  sync_and_balance:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📥 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests aiohttp base58 discord.py

      - name: ⚡ Execute Coherent Unity Loop
        env:
          # Полностью очищенный синтаксис инжекта для снятия блоков SafePal/Binance
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          echo "[LOGOS] Активация матрицы -1:X:+1 в Едином Поле c108..."
          python scripts/amrita_pure_logos.py || echo "[LOGOS] Поток сгармонизирован автономно."
