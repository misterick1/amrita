name: 🔱 DISCORD EZHENYSH BOT

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run_discord:
    runs-on: ubuntu-latest
    steps:
    - name: 📦 Checkout Core
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📂 Install Discord Library
      run: |
        python -m pip install --upgrade pip
        pip install discord.py

    - name: 🚀 Run Discord Bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: |
        if [ -f scripts/amrita_discord.py ]; then
          python scripts/amrita_discord.py
        elif [ -f bot.py ]; then
          python bot.py
        else
          python src/bot.py
        fi
