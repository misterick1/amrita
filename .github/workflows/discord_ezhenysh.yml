name: 🔱 DISCORD EZHENYSH BOT

on:
  schedule:
    - cron: '15 */3 * * *' # Сдвинутый импульс Discord-узла (без конфликта сессий с bot.yml)
  workflow_dispatch:

concurrency:
  group: "discord-ezhenysh-bot"
  cancel-in-progress: false

jobs:
  run_discord:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Core
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📂 Install Discord Library
        run: |
          python -m pip install --upgrade pip
          pip install discord.py

      - name: 🚀 Run Discord Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -f scripts/amrita_discord.py ]; then
            timeout -k 5 60s python scripts/amrita_discord.py || echo "✨ Сессия amrita_discord.py завершена."
          elif [ -f bot.py ]; then
            timeout -k 5 60s python bot.py || echo "✨ Сессия bot.py завершена."
          elif [ -f src/bot.py ]; then
            timeout -k 5 60s python src/bot.py || echo "✨ Сессия src/bot.py завершена."
          fi
