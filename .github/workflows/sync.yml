      - name: Commit and Sealed History Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "misterick1@gmail.com"
          git config --global user.name "misterick1"
          
          # Настраиваем автоматическое слияние веток по умолчанию
          git config --global pull.rebase true
          
          # Перенастраиваем удаленный репозиторий на использование системного токена
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git"
          
          # Забираем измененный файл истории
          git add history_log.json 2>/dev/null || true
          
          # Фиксируем коммит, только если есть реальные новые записи
          git diff-index --quiet HEAD || git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
          
          # ПРИНУДИТЕЛЬНОЕ СЛИЯНИЕ С СЕРВЕРОМ (Сносит любой rejected на своем пути)
          git pull origin main --no-edit
          
          # Финальный изумрудный пуш через авторизованный шлюз
          git push origin main
