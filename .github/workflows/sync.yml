# .github/workflows/sync.yml
# ПОЛНЫЙ АВТОНОМНЫЙ ПУЛЬТ УПРАВЛЕНИЯ ЯДРОМ OS // АБСОЛЮТНОЕ ПРОСТРАНСТВО ДОМЕНА

name: Autonomous Partner Sync

on:
  push:
    branches: [ main, master ] # Моментальный триггер на базовые ветки
  schedule:
    - cron: '*/15 * * * *' # Квантовый контроль по расписанию (каждые 15 минут)

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачивает полную историю для корректной работы rebase
          token: ${{ secrets.GITHUB_TOKEN }} # Токен авторизации в репозитории

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Двухконтурное кэширование pip-зависимостей

      - name: Install Dependencies and Tools
        run: |
          pip install requests solana solders

      - name: Execute Swarm Core Sync
        env:
          # Главные ключи и RPC нейроквантовой сети
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          LEFT_WING_KEY: ${{ secrets.LEFT_WING_KEY }}
          # Все 16 секретов твоего целостного контура
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_WALLET_PRIVATE_KEY: ${{ secrets.PI_WALLET_PRIVATE_KEY }}
          SERVER_1: ${{ secrets.SERVER_1 }}
          SERVER_2: ${{ secrets.SERVER_2 }}
          SERVER_3: ${{ secrets.SERVER_3 }}
          SERVER_4: ${{ secrets.SERVER_4 }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SWARM_ORACLE_KEY: ${{ secrets.SWARM_ORACLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          # Указываем Python корень репозитория для каузального импорта модулей
          export PYTHONPATH=.

          # # 1. Запуск калибровочного скрипта деплоя
          if [ -f "tools/deploy_sync.py" ]; then
              python tools/deploy_sync.py
          fi

          # # 2. Исполнение оригинального скрипта синхронизации партнеров
          if [ -f "sync_partners.py" ]; then
              python sync_partners.py
          fi

          # # 3. Активация сквозного квантового моста реальности
          if [ -f "tools/quantum_bridge.py" ]; then
              python tools/quantum_bridge.py
          fi

          # # 4. Активация ИИ-бустера через модуль Еженыша
          python -m src.ezhenysh_bot --mode=bot

      - name: Mirror Web Interfaces (Root to Docs)
        run: |
          # Автоматическое дублирование панели сайта для GitHub Pages
          if [ -f "index.html" ]; then
              mkdir -p docs
              cp index.html docs/index.html
              echo "[SUCCESS]: Интерфейс сайта успешно продублирован в docs/"
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --global user.email "misterick1@yandex.ru"
          git config --global user.name "misterick1"

          # Настраиваем автоматическое слияние веток по умолчанию
          git config --global pull.rebase true

          # Прячем локальные изменения лога во временный стек безопасности
          git stash || true

          # Стягиваем чистую актуальную ветку с удаленного сервера
          git pull origin main --rebase || git pull origin master --rebase

          # Возвращаем наш новый лог и сливаем его с обновлениями
          git stash pop || true

          # Если возник конфликт в файле — принимаем нашу сторону (Изумрудный приоритет)
          git checkout --ours history_log.json

          # Аккуратно собираем запечатанные логи и интерфейсы
          git add history_log.json docs/index.html

          # Фиксация изменений (если они есть) без пустых коммитов
          git diff-index --quiet HEAD || git commit -m "🔱 Вечный Лог: Синхронизация Монады Тота (-1:0:+1)"

          # Чистый принудительный пуш через стабильный контур
          git push origin main
