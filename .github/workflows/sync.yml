# .github/workflows/sync.yml
# ПОЛНЫЙ АВТОНОМНЫЙ ПУЛЬТ УПРАВЛЕНИЯ ЯДРОМ OS AMRITA MIR

name: Autonomous Partner Sync

on:
  schedule:
    - cron: '0 0 * * *' # Автоматический перезапуск ядра раз в сутки
  workflow_dispatch: # Позволяет запустить бота вручную в любое время

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачивает всю историю для корректного rebase

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Tools
        run: |
          pip install requests
          # Установка инструментов компиляции и интеграции Solana CLI
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
          export PATH="$HOME/.cargo/bin:$PATH"
          sh -c "$(curl -sSfL https://solana.com)"

      - name: Execute Swarm Core Sync
        env:
          # Оригинальные секреты партнерского контура
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          
          # Все 16 секретов твоего главного пула
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_WALLET_PRIVATE_KEY: ${{ secrets.PI_WALLET_PRIVATE_KEY }}
          SERVER_1: ${{ secrets.SERVER_1 }}
          SERVER_2: ${{ secrets.SERVER_2 }}
          SERVER_3: ${{ secrets.SERVER_3 }}
          SERVER_4: ${{ secrets.SERVER_4 }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SWARM_ORACLE_KEY: ${{ secrets.SWARM_ORACLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          # 1. Запуск калибровочного скрипта для вшивания СА и квантовых лимитов монет
          if [ -f "tools/deploy_sync.py" ]; then
            python tools/deploy_sync.py
          fi

          # 2. Исполнение оригинального скрипта синхронизации партнеров
          python sync_partners.py

      - name: Mirror Web Interfaces (Root to Docs Sync)
        run: |
          # Автоматическое дублирование панели мониторинга для GitHub Pages
          if [ -f "index.html" ]; then
            mkdir -p docs
            cp index.html docs/index.html
            echo "[SUCCESS]: Интерфейс сайта PiFi успешно синхронизирован в docs/"
          fi

      - name: Commit and Push Causal Changes
        run: |
          git config --global user.name "Amrita-Orchestrator"
          git config --global user.email "swarm_core@amrita.world"
          
          # Добавляем обновленные логи и сгенерированный интерфейс сайта
          git add docs/index.html history_log.json docs/
          
          # Фиксируем изменения, если они есть. Если изменений нет — пропускаем шаг без ошибки.
          git diff-index --quiet HEAD || git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
          
          # Умное слияние: стягивает новые изменения с гитхаба и накатывает лог поверх них
          git pull --rebase origin main
          
          # Безопасный пуш в основную ветку
          git push origin main
