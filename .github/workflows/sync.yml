# .github/workflows/sync.yml
# ПОЛНЫЙ АВТОНОМНЫЙ ПУЛЬТ УПРАВЛЕНИЯ ЯДРОМ OS AMRITA MIR

name: Autonomous Partner Sync

on:
  push:
    branches: [ main, master ] # Моментальный пинок ботов при твоих коммитах
  schedule:
    - cron: '*/15 * * * *' # Квантовый контроль каждые 15 минут для 66/4/38 монет

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачивает полную историю для стопроцентного слияния
          token: ${{ secrets.GITHUB_TOKEN }} # Жестко вшиваем токен на уровне скачивания

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Двухконтурное кэширование среды за 40 секунд

      - name: Install Dependencies and Tools
        run: |
          pip install requests solana solders base58

      - name: Execute Swarm Core Sync
        env:
          # Главные ключи и RPC нейроквантовой сети
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          LEFT_WING_KEY: ${{ secrets.LEFT_WING_KEY }} # Приватник кошелька misterick1
          
          # Все 16 секретов твоего целостного пула контроля внешних систем
          DEVELOPER_WALLET: ${{ secrets.DEVELOPER_WALLET }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MINT_ADDRESS: ${{ secrets.MINT_ADDRESS }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_WALLET_PRIVATE_KEY: ${{ secrets.PI_WALLET_PRIVATE_KEY }}
          SERVER_1: ${{ secrets.SERVER_1 }}
          SERVER_2: ${{ secrets.SERVER_2 }}
          SERVER_3: ${{ secrets.SERVER_3 }}
          SERVER_4: ${{ secrets.SERVER_4 }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SWARM_ORACLE_KEY: ${{ secrets.SWARM_ORACLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          # Указываем Python корень репозитория как базовую директорию для импортов
          export PYTHONPATH=.

          # 1. Запуск калибровочного скрипта вшивания СА монет контроля
          if [ -f "tools/deploy_sync.py" ]; then
            python tools/deploy_sync.py
          fi

          # 2. Исполнение оригинального скрипта синхронизации партнеров
          if [ -f "sync_partners.py" ]; then
            python sync_partners.py
          fi

          # 3. Активация сквозного квантового моста (Pi, Circle, Arc)
          if [ -f "tools/quantum_bridge.py" ]; then
            python tools/quantum_bridge.py
          fi

          # 4. Активация ИИ-бустера через модуль -m (неубиваемый импорт src)
          python -m src.ezhenysh_bot --mode=boost_bonding

      - name: Mirror Web Interfaces (Root to Docs Sync)
        run: |
          # Автоматическое дублирование панели для GitHub Pages (PiFi Мониторинг)
          if [ -f "index.html" ]; then
            mkdir -p docs
            cp index.html docs/index.html
            echo "[SUCCESS]: Интерфейс сайта успешно перенесен в docs/"
          fi

      - name: Commit and Sealed History Log
        run: |
          git config --global user.email "misterick1@gmail.com"
          git config --global user.name "misterick1"
          
          # Настраиваем автоматическое слияние веток по умолчанию
          git config --global pull.rebase true
          
          # Прячем локальные изменения лога во временный буфер, если они есть
          git stash || true
          
          # Стягиваем чистую актуальную ветку с сервера
          git pull origin main --rebase || git pull origin main
          
          # Возвращаем наш новый лог и сливаем его на уровне файлов
          git stash pop || true
          
          # Если возник конфликт в файле - принудительно берем локальный новый вариант
          git checkout --ours history_log.json 2>/dev/null || git checkout --theirs history_log.json 2>/dev/null || true
          
          # Аккуратно собираем запечатанные логи истории и веб-интерфейсы
          git add history_log.json docs/index.html docs/ 2>/dev/null || true
          
          # Фиксация изменений (если они есть), исключая ложные падения
          git diff-index --quiet HEAD || git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
          
          # Чистый принудительный пуш через стандартный авторизованный контур
          git push origin main
