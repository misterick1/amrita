name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: true

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁 Квантовая Синхронизация Времен
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разряда
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests

      - name: 🛡 Фиксация Истории Через API-Контекст
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import requests
          import base64
          import os
          import json

          token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('GITHUB_REPOSITORY')
          path = 'history_log.json'

          url = f'https://github.com{repo}/contents/{path}'

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              encoded_content = base64.b64encode(content.encode('utf-8')).decode('utf-8')

              sha = None
              res = requests.get(url, headers=headers)
              if res.status_code == 200:
                  sha = res.json().get('sha')

              payload = {
                  "message": "🔱 AMRITA: History log sealed",
                  "content": encoded_content,
                  "branch": "main"
              }

              if sha:
                  payload["sha"] = sha

              put_res = requests.put(url, headers=headers, json=payload)
              print(f"API Push Status: {put_res.status_code}")

              if put_res.status_code in (200, 201):
                  print("✅ Квантовый лог успешно стабилизирован.")
              else:
                  print(f"❌ Ошибка фиксации API: {put_res.status_code}")
          else:
              print("Лог истории не изменился, API синхронизация пропущена.")
