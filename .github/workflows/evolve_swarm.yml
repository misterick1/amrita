name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana

      - name: 🚀 Execute Ezhenysh Evolution Module
        run: |
          if [ -f "amrita.py" ]; then
            python amrita.py
          elif [ -f "src/amrita.py" ]; then
            python src/amrita.py
          else
            echo "⚠️ Файл amrita.py не найден."
          fi

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # # 1. Спасаем сгенерированные файлы во временный буфер
          mkdir -p /tmp/amrita_buffer
          cp index.html /tmp/amrita_buffer/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_buffer/ 2>/dev/null || true

          # # 2. Очищаем локальное дерево и жестко синхронизируем с облаком
          git rebase --abort 2>/dev/null || true
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # # 3. Возвращаем index.html в чистую рабочую директорию
          cp /tmp/amrita_buffer/index.html ./ 2>/dev/null || true
          git add index.html 2>/dev/null || true

          # # 4. Чистый пуш кода и веб-интерфейса в ветку main (С ИСПРАВЛЕНИЕМ КОНФЛИКТОВ)
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum state update [skip ci]"
            # Защита от [rejected]: стягиваем изменения, если ветка обновилась
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi

          # # 5. Изолированная отправка файла истории в ветку logs
          if [ -f "/tmp/amrita_buffer/history_log.json" ]; then
            echo "📦 Запуск протокола изоляции тяжелых логов..."
            git fetch origin logs 2>/dev/null || true
            
            # Переключаемся на изолированную ветку logs
            git checkout -B logs || git checkout logs
            git rm -rf . 2>/dev/null || true
            
            # Переносим сохраненный лог истории и фиксируем
            cp /tmp/amrita_buffer/history_log.json ./
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum History Update [skip ci]"
              git push origin logs --force
              echo "✅ Тяжелые логи успешно запечатаны в ветке logs."
            fi
          fi

          # Безопасно возвращаем робота назад на ветку main
          git checkout main -f

          # Тотальное очищение временного буфера
          rm -rf /tmp/amrita_buffer
