name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana requests httpx solders

      - name: 🚀 Execute Ezhenysh Evolution Module
        run: |
          if [ -f "amrita.py" ]; then
            python amrita.py
          elif [ -f "src/amrita.py" ]; then
            python src/amrita.py
          else
            echo "⚠️ Файл amrita.py не найден."
          fi

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # # 1. Спасаем сгенерированные файлы во временную директорию
          mkdir -p /tmp/amrita_buffer
          cp index.html /tmp/amrita_buffer/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_buffer/ 2>/dev/null || true

          # # 2. Очищаем локальное дерево и жестко выравниваем с сервером main
          git rebase --abort 2>/dev/null || true
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # # 3. Возвращаем index.html в чистую ветку main
          cp /tmp/amrita_buffer/index.html ./ 2>/dev/null || true
          git add index.html 2>/dev/null || true

          # # 4. Чистый пуш кода и веб-интерфейса в main без конфликтов истории (Добавлен [skip ci])
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history web updated [skip ci]"
            git push origin main
          fi

          # # 5. Изолированная отправка файла логов в выделенную ветку logs
          if [ -f "/tmp/amrita_buffer/history_log.json" ]; then
            echo "📦 Запуск протокола изоляции тяжелых логов в ветку logs..."
            git fetch origin logs 2>/dev/null || echo "Ветка logs еще не создана на удаленном сервере."
            
            # Переключаемся на изолированную ветку логов (создаем её с нуля, если её нет)
            git checkout -B logs || git checkout --orphan logs
            git rm -rf . 2>/dev/null || true
            
            # Переносим сохраненный лог истории из бэкапа
            cp /tmp/amrita_buffer/history_log.json ./history_log.json 2>/dev/null || true
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history logs sealed [skip ci]"
              git push origin logs --force
              echo "✅ Тяжелые логи успешно запечатаны в автономную ветку logs!"
            fi
            
            # Безопасно возвращаем робота назад в ветку main
            git checkout main -f
          fi

          # Тотальное очищение временного буфера
          rm -rf /tmp/amrita_buffer
