name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 Execute Ezhenysh Evolution Module
        run: |
          # Запуск твоего реального ядра из корня репозитория
          python amrita.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Спасаем сгенерированные файлы во временную папку
          mkdir -p /tmp/amrita_buffer
          cp index.html /tmp/amrita_buffer/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_buffer/ 2>/dev/null || true

          # 2. Очищаем локальное дерево и жестко выравниваемся по серверу
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # 3. Возвращаем index.html в чистую ветку main
          cp /tmp/amrita_buffer/index.html ./ 2>/dev/null || true
          git add index.html 2>/dev/null || true

          # 4. Чистый пуш кода в main без конфликтов истории
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main
          fi

          # 5. Изолированная отправка файла логов в ветку logs
          if [ -f "/tmp/amrita_buffer/history_log.json" ]; then
            git fetch origin logs || echo "Branch logs not found"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            cp /tmp/amrita_buffer/history_log.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
            fi
            git checkout main
          fi

          rm -rf /tmp/amrita_buffer
