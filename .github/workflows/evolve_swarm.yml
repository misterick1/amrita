name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 Execute Ezhenysh Evolution Module
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Затягиваем коммиты, которые скрипт мог успеть отправить на сервер самостоятельно
          git fetch origin main
          
          # 2. Мягко синхронизируем локальный индекс раннера с тем, что сейчас на сервере
          git pull origin main --rebase || echo "История чиста, слияние не требуется"

          # 3. Индексируем новые файлы раунда и убираем лог из общей ветки main
          git add .
          git reset history_log.json || echo "No history_log.json to reset"
          
          # 4. Чистый пуш index.html в main — теперь без падений и [rejected]
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main
            echo "✅ Основная ветка main успешно обновлена."
          else
            echo "✨ Код в main уже соответствует актуальному состоянию сервера."
          fi

          # 5. Автономный перенос history_log.json в изолированный слой веток logs
          if [ -f "history_log.json" ]; then
            echo "Перенос history_log.json в слой logs..."
            cp history_log.json /tmp/history_log_backup.json
            
            git fetch origin logs || echo "Ветки logs еще нет на сервере"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            cp /tmp/history_log_backup.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
              echo "✅ Автономный лог успешно запечатан."
            fi
            
            git checkout main
            rm -f /tmp/history_log_backup.json
          fi
