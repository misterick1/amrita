name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 Execute Ezhenysh Evolution Module
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Спасаем результаты работы модуля во временную папку раннера
          mkdir -p /tmp/amrita_outbound_buffer
          cp index.html /tmp/amrita_outbound_buffer/ 2>/dev/null || true
          cp history_log.json /tmp/amrita_outbound_buffer/ 2>/dev/null || true

          # 2. Стираем любые локальные конфликты и жестко выравниваем локальный гит по серверу
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # 3. Возвращаем index.html из буфера в чистую рабочую директорию ветки main
          cp /tmp/amrita_outbound_buffer/index.html ./ 2>/dev/null || true
          git add index.html 2>/dev/null || true

          # 4. Безопасный пуш кода в main — теперь он гарантированно пройдет без [rejected]
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main
            echo "✅ Основная ветка main успешно синхронизирована с сервером."
          else
            echo "✨ Изменений в index.html для ветки main нет."
          fi

          # 5. Перенос и изолированная фиксация файла истории в ветку logs
          if [ -f "/tmp/amrita_outbound_buffer/history_log.json" ]; then
            echo "Перенос history_log.json в автономный слой веток..."
            
            git fetch origin logs || echo "Ветка logs еще не создана на GitHub"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            cp /tmp/amrita_outbound_buffer/history_log.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
              echo "✅ Автономный лог запечатан в ветку logs."
            else
              echo "✨ В истории логов нет новых изменений."
            fi
            
            git checkout main
          fi

          # 6. Полная очистка временных буферов на раннере
          rm -rf /tmp/amrita_outbound_buffer
