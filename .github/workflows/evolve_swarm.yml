name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Квантовый запуск каждые 6 часов
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write

# Предохранитель от наслоения очередей на GitHub
concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: true

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 👁️ Квантовая Синхронизация Времен
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разрушителя
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests aiohttp

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОНОЛИТА
        env:
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          SWARM_ORACLE_SOLANA: "Solana_Highway"
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
        run: |
          if [ -f "src/multiverse_orchestrator.py" ]; then python src/multiverse_orchestrator.py; fi

      # ПОЛНОСТЬЮ ИСПРАВЛЕННЫЙ НЕУБИВАЕМЫЙ ШАГ СИНХРОНИЗАЦИИ ИСТОРИИ С ТЕЛЕФОНОМ
      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          git config --global pull.rebase true

          # Проверяем наличие локальных логов от оркестратора
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            
            # Автоматически принимаем локальную структуру логов, если возник конфликт
            if [ -f "history_log.json" ]; then
              git checkout --ours history_log.json || true
            fi
            
            # Локальная фиксация ДО стягивания, чтобы Git знал ветку интеграции
            git commit -m "[main bdf4a87] 🔱 AMRITA: Quantum stack history sealed [skip ci]"
            
            # Стягиваем твои коммиты с телефона и ставим лог поверх них без затирания
            git pull origin main --rebase -X ours || git pull origin master --rebase -X ours
            
            # Финальный чистый толчок в сеть
            git push origin main || git push origin master
          else
            echo "🔱 Поле стабильно. Изменений эволюции роя не обнаружено."
          fi
