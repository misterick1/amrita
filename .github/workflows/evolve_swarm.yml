name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          if [ -f "history_log.json" ]; then
            echo "Файл history_log.json найден. Синхронизация через Pull-Rebase..."
            
            git add history_log.json
            
            if git diff --cached --quiet; then
              echo "✨ Изменений нет. Пропуск."
            else
              git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
              # Забираем изменения серверов и плавно склеиваем историю в один поток
              git pull origin main --rebase --autostash
              git push origin main
              echo "✅ Контур успешно синхронизирован!"
            fi
          else
            echo "Файл history_log.json не найден."
          fi
