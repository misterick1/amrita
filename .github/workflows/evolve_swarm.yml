name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁 Квантовая Синхронизация Времен
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разряда
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests

      - name: Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Скачиваем самые свежие изменения из удаленного репозитория
          git fetch origin main
          
          # Смещаем указатель на актуальный коммит, сохраняя новые файлы логов невредимыми
          git reset --mixed origin/main
          
          # Проверяем наличие файла, добавляем и пушим без конфликтов слияния
          if [ -f "history_log.json" ]; then
            git add history_log.json
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]" || echo "Нет изменений для коммита"
            
            # Пробуем отправить, в случае редкой секундной блокировки refs делаем повтор
            for i in {1..5}; do
              git push origin main && exit 0
              echo "Репозиторий временно занят, повторная попытка пуша..."
              sleep 3
              git fetch origin main
              git reset --mixed origin/main
              git add history_log.json
              git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]" || true
            done
            exit 1
          else
            echo "Файл history_log.json не найден."
          fi
