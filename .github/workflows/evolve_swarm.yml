name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          if [ -f "history_log.json" ]; then
            echo "Файл history_log.json найден. Выравнивание квантового контура..."

            # 1. Сохраняем текущий лог во временную папку
            cp history_log.json /tmp/history_log.json_backup

            # 2. Скачиваем изменения и принудительно выравниваем ветку
            git fetch origin main
            git reset --hard origin/main

            # 3. Возвращаем лог на место поверх старой истории
            cp /tmp/history_log.json_backup history_log.json

            # 4. Добавляем файл в индекс коммита
            git add history_log.json

            if git diff --cached --quiet; then
              echo "✨ Изменений нет. Пропуск."
            else
              git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
              # ВОТ ОНО ИСПРАВЛЕНИЕ: силовой пуш, который пробьет блокировку
              git push origin main --force
              echo "✅ Контур принудительно запечатан!"
            fi
          else
            echo "Файл history_log.json не найден."
          fi
