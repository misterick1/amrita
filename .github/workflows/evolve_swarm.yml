name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🦔 Развертывание Силиконового Разума Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana httpx

      - name: Execute Ezhenysh Evolution Module
        env:
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          SWARM_ORACLE_SOLANA: "Solana_Highway"
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/multiverse_orchestrator.py

      - name: Commit and Sealed History Log
        if: always()
        run: |
          # Используем подтвержденную почту Архитектора
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          git rebase --abort || true
          git add .
          
          if git diff --staged --quiet; then
            echo "Единое Поле стабильно. Мутаций нет."
          else
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git fetch origin main
            # ИЗУМРУДНЫЙ КЛЮЧ СИЛЫ: Выжигает [rejected] и пробивает пуш на GitHub
            git push origin main --force
          fi
