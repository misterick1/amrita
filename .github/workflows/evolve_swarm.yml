name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana httpx requests aiohttp

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОНОЛИТА И СИЛОВОГО КОНТУРА
        env:
          PI_WALLET_PASSPHRASE: ${{ secrets.PI_WALLET_PASSPHRASE }}
          SWARM_ORACLE_SOLANA: "Solana_Highway"
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
        run: |
          python src/multiverse_orchestrator.py

      - name: 🛡️ Фиксация Истории Через API-Контур
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import requests
          import base64
          import os

          token = os.getenv('GITHUB_TOKEN')
          path = 'history_log.json'
          
          # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Жесткий абсолютный URL без переменных и склеек
          url = 'https://github.com'
          
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          if os.path.exists(path):
              # Получаем SHA-хэш из официального репозитория
              res = requests.get(url, headers=headers)
              sha = res.json().get('sha') if res.status_code == 200 else None

              # Читаем локальный лог
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              encoded = base64.b64encode(content.encode('utf-8')).decode('utf-8')

              payload = {
                  'message': '🔱 AMRITA: History log sealed via API Bypass [skip ci]',
                  'content': encoded,
                  'branch': 'main'
              }
              if sha:
                  payload['sha'] = sha

              # Изолированный пуш обновлений напрямую
              put_res = requests.put(url, headers=headers, json=payload)
              print(f'API Push Status: {put_res.status_code}')
          else:
              print('Лог истории не изменился, API синхронизация не требуется.')
