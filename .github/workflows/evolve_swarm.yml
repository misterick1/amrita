name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🛠️ Предотвращение конфликтов Git (Блокировка [rejected])
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"
          
          # Затягиваем все обновления, которые появились на сервере, ДО запуска скрипта
          git fetch origin main
          git checkout main
          git pull origin main --no-edit || echo "Конфликтов нет, ветка чистая"

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          # 1. Индексируем новые файлы, созданные Свармом
          git add .

          # 2. Изолируем log-файл от основной ветки main
          git reset history_log.json || echo "No history_log.json to unstage"

          # 3. Фиксируем и отправляем измененный index.html и код в main
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main
            echo "✅ Основная ветка main успешно обновлена."
          else
            echo "✨ Изменений для ветки main нет."
          fi

          # 4. Автономный перенос history_log.json в изолированную ветку logs
          if [ -f "history_log.json" ]; then
            echo "Обнаружен history_log.json. Перенос в слой логов..."
            
            # Сохраняем свежий лог во временную папку раннера
            cp history_log.json /tmp/history_log_backup.json
            
            # Переключаемся на ветку logs (создаем, если ее еще нет)
            git fetch origin logs || echo "Ветки logs еще нет на удаленном сервере"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            # Возвращаем файл лога и пушим его отдельно
            cp /tmp/history_log_backup.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
              echo "✅ Автономный лог успешно запечатан."
            else
              echo "✨ Изменений в истории логов нет."
            fi
            
            # Возвращаем указатель раннера на main
            git checkout main
            rm -f /tmp/history_log_backup.json
          else
            echo "Файл истории логов не найден."
          fi
