name: 🔱 AMRITA Swarm Evolution Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Сохраняем сгенерированные файлы во временный буфер раннера
          mkdir -p /tmp/swarm_outbound
          cp index.html /tmp/swarm_outbound/ 2>/dev/null || true
          cp history_log.json /tmp/swarm_outbound/ 2>/dev/null || true

          # 2. Очищаем рабочую директорию, чтобы вернуться к чистому состоянию main
          git reset --hard HEAD
          git clean -fd

          # 3. Обработка изоляции лога (history_log.json) в выделенный слой logs
          if [ -f "/tmp/swarm_outbound/history_log.json" ]; then
            echo "Фиксация истории логов..."
            # Переключаемся на ветку logs (создаем, если её нет)
            git checkout logs 2>/dev/null || git checkout -b logs
            
            # Возвращаем файл лога из буфера
            cp /tmp/swarm_outbound/history_log.json ./
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              # Ветку логов можно пушить принудительно, на ней нет защиты
              git push origin logs --force
            fi
          fi

          # 4. Обработка index.html через мягкую синхронизацию с main
          if [ -f "/tmp/swarm_outbound/index.html" ]; then
            echo "Фиксация артефактов раунда сварма в ветку main..."
            
            # Возвращаемся на main и затягиваем самые свежие изменения, которые могли прийти на сервер
            git checkout main
            git fetch origin main
            git reset --hard origin/main
            
            # Накатываем сгенерированный index.html поверх актуального main
            cp /tmp/swarm_outbound/index.html ./
            git add index.html
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
              
              # Попытка обычного пуша. Если на сервере появились новые коммиты,
              # делаем быструю склейку (pull) и отправляем, чтобы обойти блокировку [rejected]
              git pull origin main --no-edit || git reset --hard origin/main
              git push origin main
              echo "✅ Срез раунда успешно запечатан в main."
            fi
          fi

          # Очистка буфера
          rm -rf /tmp/swarm_outbound
