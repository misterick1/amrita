      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Индексируем измененные свармом файлы
          git add .
          
          # 2. Изолируем log-файл, чтобы он не мешал основной ветке
          git reset history_log.json || echo "No history_log.json to reset"
          
          # 3. Делаем локальный коммит изменений кода
          git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]" || echo "No changes to commit"
          
          # 4. ИСПРАВЛЕНИЕ ОШИБКИ: затягиваем коммиты из облака и плавно склеиваем историю
          git pull --rebase origin main
          
          # 5. Чистый и безопасный пуш без конфликтов
          git push origin main

          # 6. Автономный перенос history_log.json в изолированную ветку logs
          if [ -f "history_log.json" ]; then
            echo "Файл лога найден. Перенос в слой logs..."
            cp history_log.json /tmp/history_log_backup.json
            
            git fetch origin logs || echo "Branch logs does not exist yet"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            cp /tmp/history_log_backup.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
            fi
            
            git checkout main
            rm -f /tmp/history_log_backup.json
          fi
