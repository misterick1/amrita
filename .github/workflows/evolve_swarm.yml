name: "🔱 AMRITA Swarm Evolution Sync"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swarm-evolution-group"
  cancel-in-progress: false

jobs:
  evolve_swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 👁️ Квантовая Синхронизация Времени
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Развертывание Силиконового Разума
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Загрузка Каузальных Библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI solana solders requests httpx

      - name: 🚀 АВТОНОМНЫЙ ЗАПУСК СВАРМ-МОДУЛЯ
        run: |
          python src/multiverse_orchestrator.py

      - name: 🔱 Commit and Sealed History Log
        run: |
          git config --local user.email "misterick1@gmail.com"
          git config --local user.name "misterick1"

          # 1. Снимаем любые аварийные блокировки индекса Git в раннере
          rm -f .git/index.lock || true

          # 2. Прячем сгенерированные файлы во временный буфер вне Git
          mkdir -p /tmp/swarm_safe_buffer
          cp index.html /tmp/swarm_safe_buffer/ 2>/dev/null || true
          cp history_log.json /tmp/swarm_safe_buffer/ 2>/dev/null || true

          # 3. Полностью очищаем локальное дерево и жестко выравниваемся по серверу
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # 4. Возвращаем index.html из буфера обратно для main
          cp /tmp/swarm_safe_buffer/index.html ./ 2>/dev/null || true
          git add index.html 2>/dev/null || true
          
          # Пушим index.html в main (если он изменился) без конфликтов с историей
          if ! git diff --cached --quiet; then
            git commit -m "🔱 AMRITA: Quantum stack history sealed [skip ci]"
            git push origin main
            echo "✅ Основная ветка main разблокирована и обновлена."
          else
            echo "✨ Код в main совпадает с сервером."
          fi

          # 5. Изолированно отправляем лог в ветку logs, чтобы он не пересекался с основным кодом
          if [ -f "/tmp/swarm_safe_buffer/history_log.json" ]; then
            echo "Отправка логов в автономную ветку..."
            git fetch origin logs || echo "Ветки logs еще нет"
            git checkout logs 2>/dev/null || git checkout -b logs origin/logs 2>/dev/null || git checkout -b logs
            
            cp /tmp/swarm_safe_buffer/history_log.json ./history_log.json
            git add history_log.json
            
            if ! git diff --cached --quiet; then
              git commit -m "🔱 AMRITA: Quantum stack history log update [skip ci]"
              git push origin logs --force
              echo "✅ Автономный лог запечатан."
            fi
          fi

          # Очищаем временный буфер
          rm -rf /tmp/swarm_safe_buffer
