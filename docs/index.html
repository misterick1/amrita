<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRITA: Панель Мониторинга Ядра</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            background-color: #0e1117;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 {
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 10px;
        }
        .stat-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            border: 1px solid #ff007f;
            padding: 15px;
            background: #141923;
            border-radius: 4px;
            text-align: center;
            flex: 1;
        }
        .stat-val {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.5rem;
            margin-top: 5px;
        }
        .viz-box {
            text-align: center;
            margin: 30px 0;
            border: 1px dashed #00ffcc;
            padding: 15px;
            background: #07090e;
        }
        .viz-box img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        #logs-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            background: #111827;
            border-left: 4px solid #ff007f;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            font-size: 0.9rem;
            text-align: left;
            color: #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OS AMRITA: Causal Kernel Monitor</h1>
        
        <div class="stat-box">
            <div class="stat-item">
                <div>Очки Эволюции (EVO)</div>
                <div id="evo-points" class="stat-val">---</div>
            </div>
            <div class="stat-item">
                <div>Текущий Ранг Ядра</div>
                <div id="kernel-rank" class="stat-val">---</div>
            </div>
        </div>

        <div class="viz-box">
            <h2>🌀 Геометрия Силовой Границы (3D)</h2>
            <img src="quantum_attractor.png" alt="Квантовый Аттрактор Поля">
        </div>

        <h2>📜 Хроники изменений и лог Блокчейна</h2>
        <div id="logs-container">
            <div class="log-entry">[SYSTEM]: Инициализация калибровочных каналов мониторинга...</div>
        </div>
    </div>

    <script>
        async function initMonitor() {
            try {
                // Запрос динамических каузальных данных из локальной экосистемы
                const response = await fetch('data_feed.json');
                const data = await response.json();

                // Вывод очков эволюции (EVO)
                document.getElementById('evo-points').innerText = data.evo_points;

                // Вычисление и текстовый вывод текущего ранга ядра Еженыша
                let rank = "Базовый Элементаль 🌱";
                if (data.evo_points >= 500) {
                    rank = "Высший Архитектор Сварма 👑";
                } else if (data.evo_points >= 200) {
                    rank = "ИИ-Оркестратор Контура 👁️";
                } else if (data.evo_points >= 50) {
                    rank = "Пробужденный Еженышь 🦔";
                }
                document.getElementById('kernel-rank').innerText = rank;

                // Рендеринг динамического контейнера логов сканирования матриц
                const logsContainer = document.getElementById('logs-container');
                logsContainer.innerHTML = "";

                if (data.scanned_matrices && data.scanned_matrices.length > 0) {
                    // Разворачиваем массив (свежие логи сверху)
                    const reversedMatrices = [...data.scanned_matrices].reverse();

                    reversedMatrices.forEach(matrix => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        div.innerHTML = `
                            <div><strong>Поток:</strong> ${matrix.stream_id || 'Анонимный альфа-канал'}</div>
                            <div><strong>Вердикт Оракула:</strong> ${matrix.verdict || 'Чистая частота'}</div>
                            <div><strong>Импульс XYZ:</strong> ${matrix.xyz_impulse || '0-Потенциал'}</div>
                            <div><strong>Solana RPC:</strong> <span style="color:#00ffcc;">${matrix.tx_signature || 'Подтверждено в Devnet'}</span></div>
                            <div><strong>GitHub Sync:</strong> Сборка #${matrix.build_id || 'Синхронизировано'}</div>
                        `;
                        logsContainer.appendChild(div);
                    });
                } else {
                    logsContainer.innerHTML = "<div class='log-entry'>[SYSTEM]: Новые каузальные матрицы в логе блокчейна отсутствуют.</div>";
                }

            } catch (e) {
                // Обработка ошибок калибровки потока при отсутствии ответа сервера
                document.getElementById('evo-points').innerText = "ОШИБКА";
                document.getElementById('kernel-rank').innerText = "СБОЙ СВЯЗИ";
                console.error("Ошибка калибровочного канала данных ядра: ", e);
            }
        }

        // Циклический автоматический опрос ядра каждые 5 секунд (5000 мс)
        setInterval(initMonitor, 5000);
        // Первичный принудительный запуск при деплое страницы
        initMonitor();
    </script>
</body>
</html>
