<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://pinet.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRITA: Панель Мониторинга Ядра</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            background-color: #0e1117;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 {
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 10px;
        }
        .stat-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            border: 1px solid #ff007f;
            padding: 15px;
            background: #141923;
            border-radius: 4px;
            text-align: center;
            flex: 1;
        }
        .stat-val {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.2rem;
            margin-top: 5px;
            word-break: break-all;
        }
        .viz-box {
            text-align: center;
            margin: 30px 0;
            border: 1px dashed #00ffcc;
            padding: 15px;
            background: #07090e;
        }
        .viz-box img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        #logs-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            background: #111827;
            border-left: 4px solid #ff007f;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            font-size: 0.9rem;
            text-align: left;
            color: #e5e7eb;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OS AMRITA: Causal Kernel Monitor</h1>
        
        <div class="stat-box">
            <div class="stat-item">
                <div>Очки Эволюции (EVO)</div>
                <div id="evo-points" class="stat-val">...</div>
            </div>
            <div class="stat-item">
                <div>Текущий Ранг Ядра</div>
                <div id="kernel-rank" class="stat-val">...</div>
            </div>
        </div>

        <div class="viz-box">
            <h2>🌀 Геометрия Силовой Границы (3D Карта)</h2>
            <img src="quantum-attractor.png" alt="Quantum Attractor Viz">
        </div>

        <h2>📜 Хроники изменений и лог Блокчейна</h2>
        <div id="logs-container">
            <div class="log-entry">[SYSTEM]: Подготовка к калибровке...</div>
        </div>
    </div>

    <script>
        async function initMonitor() {
            try {
                // Прямой запрос к твоему живому источнику логов
                const response = await fetch('data.json');
                const data = await response.json();

                // Извлекаем первый объект каузального потока
                const currentFlow = data[0];

                // Выводим Уровень Эволюции Атмы
                document.getElementById('evo-points').innerText = currentFlow.evo || '0';

                // Выводим Статус Мира в Ранг Ядра
                document.getElementById('kernel-rank').innerText = currentFlow.rank || 'ДОПУСК 0';

                // Очищаем и строим логи строго по структуре
                const logsContainer = document.getElementById('logs-container');
                logsContainer.innerHTML = "";

                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = `
                    <div><strong>Поток:</strong> ${currentFlow.stream || 'Синхронизирован'}</div>
                    <div><strong>Вердикт Оракула:</strong> ${currentFlow.verdict || 'Успешно'}</div>
                    <div><strong>Импульс XYZ (Частота):</strong> ${currentFlow.hz || 'Стабильная'}</div>
                    <div><strong>Аватар Богини (Статус):</strong> ${currentFlow.avatar || 'Активен'}</div>
                    <div><strong>Solana RPC / Метрики:</strong> ${currentFlow.sol || '144.15'}</div>
                `;
                logsContainer.appendChild(div);

            } catch (e) {
                document.getElementById('evo-points').innerText = 'Ошибка';
                document.getElementById('kernel-rank').innerText = 'Ошибка';
                console.error("Ошибка калибровки интерфейса:", e);
            }
        }

        // Автообновление каждые 5 секунд согласно циклу
        setInterval(initMonitor, 5000);
        // Первичный запуск при деплое
        initMonitor();
    </script>
</body>
</html>
